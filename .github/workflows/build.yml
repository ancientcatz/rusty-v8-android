name: Build

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: "rusty_v8 crate version (e.g. 130.0.7)"
        required: true
        default: "130.0.7"

jobs:
  build:
    strategy:
      # Cancel other targets as soon as one fails — a rerun is needed anyway, so save time.
      fail-fast: true
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
            lib_suffix: aarch64-linux-android
          - target: x86_64-linux-android
            os: ubuntu-latest
            lib_suffix: x86_64-linux-android

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # v140+ cold builds approach 120min; leave enough headroom.
    timeout-minutes: 150

    # actions: write is used to prune old v8-deps caches.
    permissions:
      actions: write
      contents: read

    env:
      # All external version numbers that affect build artifacts are centralized here.
      # Changes invalidate the cache via the cache key.
      NDK_VERSION: r29
      ANDROID_API_LEVEL: "24"

    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libclang-dev
          # rusty_v8 v152+ libc++ requires Clang 21.1+; use LLVM 21 for the top-level
          # bindgen. V8 internal still uses its own --libclang-path clang, unaffected.
          curl -sSf https://apt.llvm.org/llvm.sh | sudo bash -s 21
          sudo apt-get install -y libclang-21-dev

      - name: Download GN (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL -o /tmp/gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          mkdir -p /tmp/gn && cd /tmp/gn && unzip -o /tmp/gn.zip && chmod +x gn
          echo "GN=/tmp/gn/gn" >> "$GITHUB_ENV"

      # rusty_v8 source cache (per V8 version, shared across targets).
      # Note: actions/cache `!` exclusion patterns are unreliable for directories
      # (same in v4/v5). Instead, restore then explicitly rm -rf third_party/rust-toolchain —
      # V8 build.rs will re-download it for the current OS.
      - uses: actions/cache/restore@v5
        id: src-cache
        with:
          path: rusty_v8-src
          key: rusty-v8-src-v${{ inputs.v8_version }}

      # rusty_v8 source: use actions/checkout (GitHub-native, more stable than cargo's
      # built-in git lib for chromium.googlesource.com submodules).
      # clean: false preserves untracked files build.rs drops into the checkout (android_platform, etc.).
      - name: Checkout rusty_v8 source
        if: steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: denoland/rusty_v8
          ref: v${{ inputs.v8_version }}
          submodules: recursive
          path: rusty_v8-src
          clean: false

      # rust-toolchain is an OS-specific binary (macOS bindgen cannot run on Linux).
      # The cache may have been saved on a different OS; force-delete so V8 build.rs
      # re-downloads for the current OS. No-op if absent.
      - name: Purge OS-specific rust-toolchain
        run: rm -rf rusty_v8-src/third_party/rust-toolchain

      - name: Create build crate
        run: |
          # v8-build is a wrapper crate that depends on the local rusty_v8 source via path.
          mkdir -p v8-build/src
          echo "fn main() {}" > v8-build/src/main.rs
          cat > v8-build/Cargo.toml << 'EOF'
          [package]
          name = "v8-build"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          v8 = { path = "../rusty_v8-src" }
          EOF

          # Copy rusty_v8's Cargo.lock as a seed so transitive deps (icu_calendar, etc.)
          # are not auto-resolved by cargo to incompatible newer versions.
          if [ -f rusty_v8-src/Cargo.lock ]; then
            cp rusty_v8-src/Cargo.lock v8-build/Cargo.lock
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v8-build
          key: ${{ matrix.target }}-${{ inputs.v8_version }}

      # NDK cache (reused across V8 versions; stored in a separate path; Android targets only,
      # runner is always Linux).
      - uses: actions/cache/restore@v5
        id: ndk-cache
        if: contains(matrix.target, 'android')
        with:
          path: /tmp/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      # V8 build artifacts (per target + V8 version; host OS is implied by matrix.target).
      # - gn_out: ninja build output (several GB, contains .o/.a for host and target).
      # - clang: Chromium-downloaded host clang (~640MB).
      # Uses a fixed key. actions/cache/save silently skips on duplicate key,
      # so before saving we delete the old cache via API to force a refresh.
      # This lets partial builds accumulate over successive runs.
      - uses: actions/cache/restore@v5
        id: v8-cache
        with:
          path: |
            v8-build/target/${{ matrix.target }}/release/gn_out
            v8-build/target/${{ matrix.target }}/release/clang
          key: v8-deps-${{ matrix.target }}-v${{ inputs.v8_version }}-api${{ env.ANDROID_API_LEVEL }}

      - name: Prepare Android NDK
        if: contains(matrix.target, 'android')
        run: |
          V8_SRC="$GITHUB_WORKSPACE/rusty_v8-src"
          echo "V8_SRC=$V8_SRC" >> "$GITHUB_ENV"

          # v149-v150's chromium_build revision removed the android_ndk_version
          # declaration, but BUILD.gn still references it. Patch the actually-used
          # NDK version back into the standard config.gni location; older versions
          # that already declare the variable, and future fixed versions, are
          # left untouched.
          ANDROID_CONFIG="$V8_SRC/build/config/android/config.gni"
          if ! grep -q 'android_ndk_version' "$ANDROID_CONFIG"; then
            sed -i \
              "/^  android_ndk_root = \"\\/\\/third_party\\/android_toolchain\\/ndk\"$/a\\  android_ndk_version = \"$NDK_VERSION\"" \
              "$ANDROID_CONFIG"
            grep -Fxq "  android_ndk_version = \"$NDK_VERSION\"" "$ANDROID_CONFIG"
          fi

          # NDK is stored at a separate path (/tmp/android-ndk-<version>); V8 references it via symlink.
          NDK_CACHE_DIR="/tmp/android-ndk-${NDK_VERSION}"
          if [ ! -d "$NDK_CACHE_DIR" ]; then
            curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            unzip -q -d /tmp /tmp/ndk.zip
            mv "/tmp/android-ndk-${NDK_VERSION}" "$NDK_CACHE_DIR" 2>/dev/null || true
            rm /tmp/ndk.zip
          fi

          # Symlink into the path V8 expects.
          NDK_DIR="$V8_SRC/third_party/android_ndk"
          ln -sfn "$NDK_CACHE_DIR" "$NDK_DIR"

          # Symlink android_toolchain/ndk -> android_ndk
          mkdir -p "$V8_SRC/third_party/android_toolchain"
          ln -sfn "$NDK_DIR" "$V8_SRC/third_party/android_toolchain/ndk"

          # Create pydeps stubs
          AB="$V8_SRC/build/android"
          mkdir -p "$AB/pylib/results/presentation" "$AB/test_wrapper"
          for f in devil_chromium.pydeps apk_operations.pydeps test_runner.pydeps resource_sizes.pydeps; do
            touch "$AB/$f"
          done
          touch "$AB/pylib/results/presentation/test_results_presentation.pydeps"
          touch "$AB/test_wrapper/logdog_wrapper.pydeps"

          # v8 145+ host rust toolchain depends on the Debian bullseye sysroot
          # (gn has an assert(path_exists(sysroot)) check).
          SYSROOT_SCRIPT="$V8_SRC/build/linux/sysroot_scripts/install-sysroot.py"
          if [ -f "$SYSROOT_SCRIPT" ] && [ ! -d "$V8_SRC/build/linux/debian_bullseye_amd64-sysroot" ]; then
            python3 "$SYSROOT_SCRIPT" --arch=amd64
          fi

          # v8 140+ requires build/rust/known-target-triples.txt (rusty_v8 omits it when slimming the source).
          mkdir -p "$V8_SRC/build/rust"
          cat > "$V8_SRC/build/rust/known-target-triples.txt" << 'TRIPLES'
          aarch64-linux-android
          armv7-linux-androideabi
          x86_64-linux-android
          i686-linux-android
          aarch64-unknown-linux-gnu
          x86_64-unknown-linux-gnu
          aarch64-apple-darwin
          x86_64-apple-darwin
          x86_64-pc-windows-msvc
          aarch64-pc-windows-msvc
          TRIPLES

          # Configure linker
          LINKER="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          if [ "${{ matrix.target }}" = "x86_64-linux-android" ]; then
            LINKER="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
          fi
          mkdir -p v8-build/.cargo
          cat > v8-build/.cargo/config.toml << TOML
          [target.${{ matrix.target }}]
          linker = "$LINKER"
          rustflags = ["-C", "link-args=-Wl,--allow-multiple-definition"]
          TOML

          # bindgen clang config: v130 and v140+ are handled differently.
          # - v130-v139: only rusty_v8 build.rs top-level bindgen; env var includes --target.
          # - v140+: both V8 internal ninja bindgen and rusty_v8 top-level bindgen run in the same cargo build.
          #   Including --target in env would override V8 internal host call's --target=x86_64-linux-gnu,
          #   causing -msse3 errors. So only pass --sysroot + -isystem, no --target.
          #   (bindgen crate derives target from TARGET; V8 internal CLI keeps its own --target.)
          NDK_LIB="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/lib"
          NDK_SYSROOT="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ARCH_INCLUDE="aarch64-linux-android"
          if [ "${{ matrix.target }}" = "x86_64-linux-android" ]; then
            ARCH_INCLUDE="x86_64-linux-android"
          fi
          BINDGEN_VAR="BINDGEN_EXTRA_CLANG_ARGS_$(echo '${{ matrix.target }}' | tr '-' '_')"
          if [ ! -f "$V8_SRC/tools/rust_toolchain.py" ]; then
            # v130-v139: old Chromium libc++ is compatible with NDK libc++, use NDK's; include --target.
            echo "LIBCLANG_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
            echo "${BINDGEN_VAR}=--sysroot=$NDK_SYSROOT -isystem $NDK_SYSROOT/usr/include/c++/v1 -isystem $NDK_SYSROOT/usr/include -isystem $NDK_SYSROOT/usr/include/$ARCH_INCLUDE --target=${{ matrix.target }}${ANDROID_API_LEVEL}" >> "$GITHUB_ENV"
          else
            # v140+: use llvm-21's libclang for the top-level bindgen;
            # V8's bundled libc++ headers replace the NDK's.
            echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"
            echo "${BINDGEN_VAR}=--sysroot=$NDK_SYSROOT -isystem $V8_SRC/third_party/libc++/src/include -isystem $NDK_SYSROOT/usr/include -isystem $NDK_SYSROOT/usr/include/$ARCH_INCLUDE" >> "$GITHUB_ENV"
          fi

      - name: Build V8 from source
        env:
          V8_FROM_SOURCE: "1"
          NINJA: /usr/bin/ninja
        run: |
          cd v8-build
          cargo build --target ${{ matrix.target }} --release

      # Save NDK cache (reused across V8 versions).
      - uses: actions/cache/save@v5
        if: always() && contains(matrix.target, 'android') && steps.ndk-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      # Save rusty_v8-src (save captures the entire directory, including untracked files
      # dropped in by build.rs such as android_platform / catapult / build / linux).
      # Remove third_party/rust-toolchain before save — OS-specific binaries cannot be shared across OSes.
      - name: Remove rust-toolchain before save
        if: always() && steps.src-cache.outputs.cache-hit != 'true'
        run: rm -rf rusty_v8-src/third_party/rust-toolchain

      - uses: actions/cache/save@v5
        if: always() && steps.src-cache.outputs.cache-hit != 'true'
        with:
          path: rusty_v8-src
          key: rusty-v8-src-v${{ inputs.v8_version }}

      # Save V8 build artifacts — force refresh on every run: first delete old cache via API
      # (actions/cache/save silently skips on duplicate key), then save the new one.
      # This lets partial builds accumulate over successive runs.
      - name: Delete stale v8-deps cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: v8-deps-${{ matrix.target }}-v${{ inputs.v8_version }}-api${{ env.ANDROID_API_LEVEL }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/caches?key=$KEY" 2>/dev/null || true

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            v8-build/target/${{ matrix.target }}/release/gn_out
            v8-build/target/${{ matrix.target }}/release/clang
          key: v8-deps-${{ matrix.target }}-v${{ inputs.v8_version }}-api${{ env.ANDROID_API_LEVEL }}

      - name: Extract artifacts
        run: |
          TARGET=${{ matrix.target }}
          SUFFIX=${{ matrix.lib_suffix }}
          BUILD_DIR="v8-build/target/$TARGET/release"

          # Static library
          LIB=$(find "$BUILD_DIR" -name "librusty_v8.a" | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::librusty_v8.a not found"
            exit 1
          fi
          OUTNAME="librusty_v8_release_${SUFFIX}.a"
          cp "$LIB" "$OUTNAME"
          gzip -f "$OUTNAME"
          ls -lh "${OUTNAME}.gz"

          # Binding file (generated by V8 build, needed by v8 crate consumers)
          BINDING=$(find "$BUILD_DIR" -name "src_binding.rs" -path "*/gn_out/*" | head -1)
          if [ -z "$BINDING" ]; then
            # Fallback: search more broadly
            BINDING=$(find "$BUILD_DIR" -name "src_binding.rs" | head -1)
          fi
          if [ -n "$BINDING" ]; then
            cp "$BINDING" "src_binding_release_${SUFFIX}.rs"
            ls -lh "src_binding_release_${SUFFIX}.rs"
          else
            echo "::error::src_binding.rs not found"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: librusty_v8-${{ matrix.lib_suffix }}
          path: |
            *.a.gz
            *.rs

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - run: ls -lh *.a.gz *.rs 2>/dev/null || true

      # make_latest defaults to "legacy" — GitHub uses semver + creation date jointly
      # (semver first, date as tiebreaker). When backfilling an old major patch (e.g. 146.9.1),
      # 147.1.0 stays Latest and is not displaced — no need to compute this ourselves.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.v8_version }}
          name: "rusty_v8 v${{ inputs.v8_version }}"
          body: |
            Prebuilt `librusty_v8.a` for Android targets, compiled from [rusty_v8 v${{ inputs.v8_version }}](https://github.com/denoland/rusty_v8/releases/tag/v${{ inputs.v8_version }}).

            Usage:
            ```bash
            RUSTY_V8_ARCHIVE=/path/to/librusty_v8_release_<target>.a cargo build --target <target>
            ```
          files: |
            *.a.gz
            *.rs
